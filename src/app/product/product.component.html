<div class="container">
  <h2>{{ isEdit ? "Edit Product" : "Add Product" }}</h2>

  <form (ngSubmit)="isEdit ? updateProduct() : addProduct()">
    <input
      type="text"
      [(ngModel)]="product.title"
      name="title"
      placeholder="Title"
      required
    />
    <input
      type="number"
      [(ngModel)]="product.price"
      name="price"
      placeholder="Price"
      required
    />
    <input
      type="text"
      [(ngModel)]="product.description"
      name="desc"
      placeholder="Description"
    />

    <button type="submit">{{ isEdit ? "Update" : "Add" }}</button>
    <button type="button" *ngIf="isEdit" (click)="cancelEdit()">Cancel</button>
  </form>

  <h2>Product List</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Price</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of products">
        <td>{{ p.id }}</td>
        <td>{{ p.title }}</td>
        <td>{{ p.price }}</td>
        <td>{{ p.description }}</td>
        <td>
          <button (click)="editProduct(p)">Edit</button>
          <button (click)="deleteProduct(p.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
