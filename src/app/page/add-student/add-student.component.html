<div class="form-page">
  <div class="form-card">
    <a routerLink="/dashboard" class="back-link"> ← Back to Dashboard </a>

    <div class="form-heading">
      <div class="form-icon">+</div>
      <h1>Add New Student</h1>
      <p>Enter the student information below.</p>
    </div>

    <form #studentForm="ngForm" (ngSubmit)="addStudent()">
      <div class="form-group">
        <label for="name">Student Name</label>
        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter full name"
          minlength="2"
          required
        />
      </div>

      <div class="form-group">
        <label for="course">Select Course</label>
        <select id="course" name="course" [(ngModel)]="course" required>
          <option value="" disabled>Select a course</option>
          <option value="Angular Development">Angular Development</option>
          <option value="JavaScript">JavaScript</option>
          <option value="Node.js">Node.js</option>
          <option value="React.js">React.js</option>
          <option value="Python">Python</option>
          <option value="TypeScript">TypeScript</option>
        </select>
      </div>

      <div class="form-group">
        <label for="marks">Marks (0–100)</label>
        <input
          id="marks"
          type="number"
          name="marks"
          [(ngModel)]="marks"
          min="0"
          max="100"
          placeholder="Enter marks"
          required
        />
      </div>

      <button type="submit" [disabled]="studentForm.invalid">
        + Add Student
      </button>
    </form>
  </div>
</div>
