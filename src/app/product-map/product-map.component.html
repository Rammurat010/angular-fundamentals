<h2>ProductMap List</h2>

<button (click)="getProducts()">Get Products</button>

<hr />

@for (product of products; track product.id) {
  <div>
    <h3>{{ product.title }}</h3>

    <p>ID: {{ product.id }}</p>

    <p>Price: {{ product.price }}</p>

    <p>Category: {{ product.category }}</p>
  </div>

  <hr />
}
