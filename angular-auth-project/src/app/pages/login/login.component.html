<div class="auth-box">
  <h2>Login</h2>

  <form (ngSubmit)="login()">
    <label> Email </label>

    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Enter email"
      required
    />

    <label> Password </label>

    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Enter password"
      required
    />

    @if (errorMessage) {
      <p class="error">
        {{ errorMessage }}
      </p>
    }

    <button type="submit">Login</button>
  </form>

  <p>
    Don't have an account?
    <a routerLink="/register"> Register </a>
  </p>
</div>
