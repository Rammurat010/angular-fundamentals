<div class="auth-box">
  <h2>Register</h2>

  <form (ngSubmit)="register()">
    <label> Name </label>

    <input
      type="text"
      name="name"
      [(ngModel)]="name"
      placeholder="Enter name"
      required
    />

    <label> Email </label>

    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Enter email"
      required
    />

    <label> Password </label>

    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Enter password"
      required
    />

    <label> Role </label>

    <select name="role" [(ngModel)]="role">
      <option value="user">User</option>

      <option value="admin">Admin</option>
    </select>

    @if (errorMessage) {
      <p class="error">
        {{ errorMessage }}
      </p>
    }

    @if (message) {
      <p class="success">
        {{ message }}
      </p>
    }

    <button type="submit">Register</button>
  </form>

  <p>
    Already have an account?
    <a routerLink="/login"> Login </a>
  </p>
</div>
