<h1>Users</h1>
@if (loading) {
  <h3>Loading Users...</h3>
} @else {
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Image</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Age</th>
          <th>Gender</th>
          <th>Company</th>
        </tr>
      </thead>

      <tbody>
        @for (user of users; track user.id) {
          <tr>
            <td>
              {{ user.id }}
            </td>
            <td>
              <img [src]="user.image" width="50" />
            </td>
            <td>
              {{ user.firstName }}
              {{ user.lastName }}
            </td>
            <td>
              {{ user.email }}
            </td>
            <td>
              {{ user.phone }}
            </td>
            <td>
              {{ user.age }}
            </td>
            <td>
              {{ user.gender }}
            </td>
            <td>
              {{ user.company.name }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
