<div>
  <h1>Counter App</h1>

  <input type="number" [(ngModel)]="count" />

  <h2>{{ count }}</h2>

  <div>
    <button (click)="decrement()">-</button>
    <button (click)="reset()">Reset</button>
    <button (click)="increment()">+</button>
  </div>

  <!-- Status message (auto-clears) -->
  <p *ngIf="statusMessage" style="color: blue">{{ statusMessage }}</p>

  <!-- User input (separate) -->
  <input [(ngModel)]="userMessage" placeholder="Type a message" />
  <p *ngIf="userMessage">Your message: {{ userMessage }}</p>
</div>
