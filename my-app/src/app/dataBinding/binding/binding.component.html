<h1>Property Binding Example</h1>

<!-- String Property Binding -->
<input [value]="name" />

<br /><br />

<!-- Number Property Binding -->
<input [value]="age" />

<br /><br />

<!-- Image Property Binding -->
<img [src]="imageUrl" width="150" />

<br /><br />

<!-- Disabled Property Binding -->
<button [disabled]="isDisabled">Submit</button>

<br /><br />

<!-- Style Property Binding -->
<p [style.color]="textColor">Hello Angular</p>
