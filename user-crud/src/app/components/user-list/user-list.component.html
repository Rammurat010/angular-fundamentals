<div class="container">
  <div class="header">
    <h1>User Management</h1>

    <a routerLink="/users/add" class="add-btn"> + Add User </a>
  </div>

  <!-- SEARCH -->

  <div class="search-box">
    <input
      type="text"
      placeholder="Search by name or email"
      [(ngModel)]="searchText"
    />
  </div>

  <!-- USER TABLE -->

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Phone</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      @for (user of filteredUsers; track user.id) {
        <tr>
          <td>
            {{ user.id }}
          </td>

          <td>
            {{ user.firstName }}
          </td>

          <td>
            {{ user.lastName }}
          </td>

          <td>
            {{ user.email }}
          </td>

          <td>
            {{ user.age }}
          </td>

          <td>
            {{ user.gender }}
          </td>

          <td>
            {{ user.phone }}
          </td>

          <td>
            <a [routerLink]="['/users/edit', user.id]" class="edit-btn">
              Edit
            </a>

            <button class="delete-btn" (click)="deleteUser(user.id!)">
              Delete
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
