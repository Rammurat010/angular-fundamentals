<div class="form-container">
  <h2>Edit User</h2>

  <form (ngSubmit)="updateUser()">
    <label> First Name </label>

    <input type="text" name="firstName" [(ngModel)]="user.firstName" required />

    <label> Last Name </label>

    <input type="text" name="lastName" [(ngModel)]="user.lastName" required />

    <label> Email </label>

    <input type="email" name="email" [(ngModel)]="user.email" required />

    <label> Age </label>

    <input type="number" name="age" [(ngModel)]="user.age" />

    <label> Gender </label>

    <select name="gender" [(ngModel)]="user.gender">
      <option value="male">Male</option>

      <option value="female">Female</option>
    </select>

    <label> Phone </label>

    <input type="text" name="phone" [(ngModel)]="user.phone" />

    <button type="submit">Update User</button>
  </form>
</div>
