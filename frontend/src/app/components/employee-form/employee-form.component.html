<div class="form-page">
  <div class="page-header">
    <div>
      @if (isEditMode) {
        <h1>Edit Employee</h1>
        <p>Update employee information</p>
      } @else {
        <h1>Add Employee</h1>
        <p>Add a new employee</p>
      }
    </div>

    <a routerLink="/employees" class="back-btn"> ← Back </a>
  </div>

  <div class="form-card">
    <form (ngSubmit)="submitForm()">
      <div class="form-grid">
        <div class="form-group">
          <label>Name</label>

          <input
            type="text"
            name="name"
            [(ngModel)]="employee.name"
            placeholder="Enter employee name"
            required
          />
        </div>

        <div class="form-group">
          <label>Email</label>

          <input
            type="email"
            name="email"
            [(ngModel)]="employee.email"
            placeholder="Enter email"
            required
          />
        </div>

        <div class="form-group">
          <label>Phone</label>

          <input
            type="text"
            name="phone"
            [(ngModel)]="employee.phone"
            placeholder="Enter phone number"
          />
        </div>

        <div class="form-group">
          <label>Department</label>

          <select name="department" [(ngModel)]="employee.department">
            <option value="">Select Department</option>

            <option value="IT">IT</option>

            <option value="HR">HR</option>

            <option value="Finance">Finance</option>

            <option value="Sales">Sales</option>

            <option value="Marketing">Marketing</option>
          </select>
        </div>

        <div class="form-group">
          <label>Salary</label>

          <input
            type="number"
            name="salary"
            [(ngModel)]="employee.salary"
            placeholder="Enter salary"
          />
        </div>

        <div class="form-group">
          <label>Joining Date</label>

          <input
            type="date"
            name="joining_date"
            [(ngModel)]="employee.joining_date"
          />
        </div>

        <div class="form-group">
          <label>Status</label>

          <select name="status" [(ngModel)]="employee.status">
            <option value="Active">Active</option>

            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <a routerLink="/employees" class="cancel-btn"> Cancel </a>

        <button type="submit" class="submit-btn">
          @if (isEditMode) {
            Update Employee
          } @else {
            Add Employee
          }
        </button>
      </div>
    </form>
  </div>
</div>
